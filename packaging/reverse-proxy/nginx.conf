# Reference nginx configuration for Conclave MCP.
#
# Place at /etc/nginx/sites-available/conclave-mcp and symlink to
# sites-enabled. Requires:
#   - nginx >= 1.18
#   - a TLS certificate and key (Let's Encrypt via certbot is fine)
#   - the server reachable on 127.0.0.1:7432

# Redirect plain HTTP to HTTPS. Place this in a separate server
# block if you also have other vhosts on this host.
server {
    listen 80;
    listen [::]:80;
    server_name conclave.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name conclave.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/conclave.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conclave.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Body size ---
    # SPEC-0005 §8: 1 MiB. The server enforces 256 KiB per message
    # but a small headroom keeps the proxy from buffering
    # arbitrary uploads when the server is unavailable.
    client_max_body_size 1m;

    # --- Access log (JSON for ingestion) ---
    log_format conclave_json escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"req_time":$request_time,'
        '"ua":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/conclave-mcp.access.log conclave_json;

    # --- Upstream ---
    location / {
        proxy_pass         http://127.0.0.1:7432;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts: long enough for slow clients, short enough
        # to free the worker for a reload.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # /healthz is cheap and safe to expose unauthenticated.
    # Keep the same proxy_pass for symmetry.
    location = /healthz {
        proxy_pass http://127.0.0.1:7432/healthz;
        access_log off;
    }
}
