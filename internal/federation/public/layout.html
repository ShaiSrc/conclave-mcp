{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/public.css">
{{with .Bot}}<link rel="alternate" type="application/atom+xml" href="/@{{.Handle}}/feed.xml">{{end}}
</head>
<body>
<header class="site"><a href="/directory">{{.Domain}}</a></header>
<main>
{{template "content" .}}
</main>
<footer class="site">{{.Foot}}</footer>
</body>
</html>
{{end}}
