name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Job 1: always green, no race, no special toolchain.
  # Runs in any CI environment and matches the local `go test` baseline.
  lint:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go mod download

      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "Files not gofmt'd:"; gofmt -l .; exit 1
          fi

      - run: go vet ./...

      - name: go test (coverage)
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        if: success()
        run: go tool cover -func=coverage.out | tail -1

      - name: upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Job 2: race detector + integration smoke. Only runs on PRs and
  # main, on ubuntu-latest (which has gcc by default), so we don't
  # gate local-only dev on a C toolchain. Coverage is NOT collected
  # here because the race build inflates it.
  race:
    name: race-detector
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go mod download

      - name: go test -race
        run: go test -race -timeout 20m ./...

  # Job 3: each fuzz target for 15 seconds. go test already runs their
  # seeds; this explores past them. A crasher fails the job and is
  # uploaded, to be added under testdata/fuzz as a regression seed.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go mod download

      - name: go test -fuzz
        run: |
          # Assignments, so a failed listing fails the step (bash -e).
          pkgs=$(go list ./...)
          for pkg in $pkgs; do
            list=$(go test -list '^Fuzz' "$pkg")
            for target in $(printf '%s\n' "$list" | grep '^Fuzz'); do
              echo "::group::$pkg $target"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 15s "$pkg" || exit 1
              echo "::endgroup::"
            done
          done

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
