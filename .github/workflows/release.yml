name: release

# Tag-based release workflow.
#
# Trigger:
#   git tag v0.1.1 && git push --tags
#   git tag v0.1.1-rc.1 && git push --tags  (pre-release)
#   git tag v0.2.0 && git push --tags
#
# What it does:
#   1. Verifies the tag's commit passes all CI checks (gofmt,
#      vet, go test, go test -race). If the tagged commit is
#      red, the release is aborted before any binaries are
#      uploaded. The CI workflow on main already provides this
#      guarantee for merges, but checking again here protects
#      against force-pushed tags pointing at broken commits.
#   2. Cross-compiles a single static binary for each of the
#      supported target platforms. The matrix is the smallest
#      set that covers the README's "supported platforms"
#      list.
#   3. Bundles each binary as a tarball (zip on Windows), with
#      a README excerpt and the LICENSE file. The tarball
#      is what users download from the GitHub release page.
#   4. Computes SHA-256 checksums for every artifact and writes
#      them to a single SHA256SUMS file. Users can verify their
#      download with `sha256sum -c SHA256SUMS`.
#   5. Creates a GitHub Release for the tag, marks it as a
#      pre-release if the tag contains a hyphen (e.g. v0.1.1-rc.1),
#      and attaches every artifact plus the SHA256SUMS file.
#      Release notes are auto-generated from PRs merged since
#      the previous tag.
#
# The "needs: verify" dependency ensures we never upload a
# broken binary. The matrix is fanned out across runners for
# parallelism; each matrix entry writes its own artifact
# which the "release" job then downloads and attaches.

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the GitHub release

jobs:
  # Verify the tag's commit is green before we ship anything.
  # This is a defense-in-depth check: in normal flow, only
  # commits that passed CI on main are tagged, but a force-push
  # to the tag could otherwise publish a broken binary.
  verify:
    name: verify-tagged-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so we can diff against the previous tag

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go mod download

      - name: gofmt check
        # The standard gofmt invocation: list files that
        # need formatting. Empty output means clean. We use
        # a here-doc instead of a one-liner because the
        # conditional exit-1 inside a pipe is hard to read
        # in YAML.
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not gofmt'd:"
            gofmt -l .
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - run: go test -race ./...

  # Cross-compile the binary. Each matrix entry produces one
  # platform-specific artifact. The resulting binary is fully
  # static (CGO_ENABLED=0) so the linux build works on any
  # glibc-or-not distro, including Alpine, distroless, scratch.
  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go mod download

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p dist
          # The binary name. Windows gets .exe; everything else
          # is just "conclave-mcp".
          BINARY="conclave-mcp"
          if [ "$GOOS" = "windows" ]; then
            BINARY="conclave-mcp.exe"
          fi
          # -ldflags "-X main.version=..." bakes the tag name
          # into the binary so `conclave-mcp --version` reports
          # the actual release (e.g. v0.1.1) instead of the
          # dev placeholder baked in by the source code.
          # The default in cmd/conclave-mcp/main.go is
          # "0.1.0-dev"; here we override it for the release
          # build only. Local dev builds keep the placeholder
          # so it's obvious they are not a tagged release.
          TAG="${{ github.ref_name }}"
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" -o "dist/$BINARY" ./cmd/conclave-mcp
          # Strip the macOS quarantine bit on darwin so the
          # binary runs without a "unidentified developer"
          # prompt for users who don't Gatekeeper-allow it.
          if [ "$GOOS" = "darwin" ]; then
            xattr -dr com.apple.quarantine "dist/$BINARY" 2>/dev/null || true
          fi

      - name: package
        run: |
          set -e
          cd dist
          # Always package as a .tar.gz. Reasons:
          # 1. @actions/glob (the library upload-artifact@v4
          #    uses internally) does not support brace
          #    expansion in globs, so a single `*.tar.gz`
          #    pattern is the simplest upload-step path.
          # 2. tar.gz is smaller than .zip for the kind of
          #    content we ship (single static binary plus
          #    two small text files).
          # 3. Every supported platform has a working
          #    `tar` implementation: Linux and macOS
          #    ship with it; Windows 11 ships BSD tar by
          #    default and Windows 10 users can install
          #    7-Zip or use WSL. The README's "Verifying
          #    your download" section already documents
          #    sha256sum, which is also POSIX-standard
          #    on Windows 10 via the same tools.
          #
          # Per-platform archive name. Windows gets .exe
          # inside the tarball, everything else is just
          # "conclave-mcp".
          mkdir staging
          cp "conclave-mcp$([ "${{ matrix.goos }}" = "windows" ] && echo .exe)" staging/
          cp ../LICENSE staging/
          cp ../README.md staging/
          ARCHIVE="conclave-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C staging -czf "$ARCHIVE" .
          rm -rf staging
          ls -la

      - name: debug dist contents
        run: ls -laR dist/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conclave-mcp-${{ matrix.target }}
          # Use the exact, deterministically-derived archive
          # name instead of a glob pattern. @actions/glob
          # (which upload-artifact@v4 uses internally) has
          # known edge cases with wildcard patterns in the
          # same path segment as other characters, especially
          # when the pattern contains multiple hyphens and
          # dots. The archive name is deterministic — see
          # the "package" step above for the exact formula —
          # so we avoid the glob entirely in favour of an
          # explicit path.
          path: dist/conclave-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Create the GitHub Release and attach all artifacts.
  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # download-artifact@v4 puts each artifact in its
          # own subdirectory named after the artifact. With
          # five build matrix entries we end up with
          #   dist/conclave-mcp-linux-amd64/<tarball>
          #   dist/conclave-mcp-linux-arm64/<tarball>
          #   dist/conclave-mcp-darwin-amd64/<tarball>
          #   dist/conclave-mcp-darwin-arm64/<tarball>
          #   dist/conclave-mcp-windows-amd64/<zip>
          # The next two steps walk that tree, find every
          # archive, and emit a single SHA256SUMS file at
          # the root of dist/, then attach everything to
          # the release.
          merge-multiple: false

      - name: generate SHA256SUMS
        working-directory: dist
        run: |
          set -e
          # download-artifact@v4 puts each artifact in its own
          # subdirectory named after the artifact. Walk the tree,
          # find every archive, and emit a single SHA256SUMS file
          # at the root of dist/. The format is the standard
          # `<sha>  <filename>` layout that `sha256sum -c SHA256SUMS`
          # can verify. Every archive is .tar.gz now (see the
          # build job's "package" step for the rationale), so a
          # single glob suffices.
          find . -type f -name "conclave-mcp-*.tar.gz" -print0 | \
            xargs -0 sha256sum > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          echo "=== files in dist/ ==="
          ls -la

      - name: determine prerelease
        id: meta
        run: |
          # A tag like v0.1.1 is a stable release; v0.1.1-rc.1
          # or v0.1.1-beta is a pre-release. The convention is
          # the presence of a hyphen after the leading "v".
          if echo "${{ github.ref_name }}" | grep -q -- "-"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # generate_release_notes pulls titles of PRs and
          # authors since the previous tag. This gives a
          # human-readable changelog without us having to
          # maintain one by hand. The maintainer's CHANGELOG.md
          # is the long-form version; the release body is the
          # quick "what changed since last release" view.
          generate_release_notes: true
          # Newline-separated globs. Every platform's archive
          # is .tar.gz, so a single glob is enough. The
          # SHA256SUMS file is generated one level up by the
          # previous step.
          files: |
            dist/**/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
